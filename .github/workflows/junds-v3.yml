# CI v3 — JunDS v3 레인 (01-repo-structure §9의 12게이트)
#
# 게이트: tokens-fresh · tokens-test · web-build · web-test(coverage) ·
#         web-browser(Chromium/Firefox/WebKit) · web-a11y · size-budget ·
#         react-build(React 18/19) · finance-data-test · ios-build ·
#         ios-test(macos-14) · bench-smoke
# install 잡은 캐시 워머(인프라)이며 게이트가 아니다.
#
# 스펙 이탈 주석:
#  - ios-build/-test는 01 §9의 `swift build`가 아니라 xcodebuild 경유 —
#    UIKit 타겟이라 host swift build 불가 (DEC-013-6이 정본).
#  - bench-smoke는 05-perf §3.2에 따라 G2까지 advisory(continue-on-error) —
#    G3 정식화 시 continue-on-error 제거 + 회귀 >10% 실패로 승격할 것.
#  - finance-data-test는 대상 패키지가 자리표시자인 동안 --if-present로 무해 통과한다.
#  - Web 실브라우저와 React peer 검증은 matrix로 분리해 한 환경의 실패가 다른 결과를
#    가리지 않으며, coverage 보고서는 패키지별 artifact로 보존한다.
#
# 로컬 검증 기록(릴리스 준비 트랙): iOS 2게이트 제외 전 스텝 명령을 로컬 1회 실행으로
# 성립 확인. iOS는 작업 머신 Xcode 서명 파손(DEC-015-2: libclang 코드서명 invalid →
# AMFI SIGKILL, xcodebuild -list·빌드 전부 사망)으로 xcodebuild 명령형 검증 불가.
# 단 빌드·테스트 실체는 DEC-015-1(CLT 우회 경로)로 XCTest 31/31 검증 완료 —
# CI 첫 실행 확인 항목은 xcodebuild 스킴명·destination 명칭뿐 (release/CHECKLIST.md).

name: CI v3

on:
  push:
    branches: [main, v3]
    paths:
      - "packages/**"
      - "tokens/**"
      - "benchmarks/**"
      - "Package.swift"
      - "docs-spec/registry/**"
      - ".changeset/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/junds-v3.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main, v3]
    paths:
      - "packages/**"
      - "tokens/**"
      - "benchmarks/**"
      - "Package.swift"
      - "docs-spec/registry/**"
      - ".changeset/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/junds-v3.yml"
      - ".github/scripts/**"
  workflow_dispatch: # 첫 실행 검증·수동 재실행용

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 인프라: node_modules 캐시 워머 — v3 레인은 node 22 (tokens 생성기의 명시 전제.
  #    v2 레인 node 20과 캐시 키 분리: deps-*-node22-*) ──
  # npm ci는 전 잡 --ignore-scripts: 루트 prepare가 v2 build:lib(+절대경로 하드코딩된
  # ensure-use-client-banner.mjs)를 태워 러너에서 ENOENT — CI v3 첫 실행(run 30021418706)
  # 실측. v3 게이트는 v2 dist 불요, 의존성 바이너리(esbuild 등)는 플랫폼 패키지
  # 모델이라 lifecycle 스크립트 없이 동작한다.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts

  # ── 게이트 1/12: tokens-fresh — 재생성 후 산출물 3종 diff 0 (01 §9) ──
  tokens-fresh:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Regenerate tokens and verify outputs committed
        run: npm run tokens:fresh

  # ── 게이트 2/12: tokens-test — 스냅샷 + v2 패리티 (02-tokens §6) ──
  tokens-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Run token tests
        run: npm run tokens:test

  # ── 게이트 3/12: web-build — typecheck + build.mjs 산출물 (01 §9) ──
  web-build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Typecheck @junds/web
        run: npm run typecheck -w @junds/web
      - name: Build @junds/web (esbuild 4산출물)
        run: npm run build -w @junds/web

  # ── 게이트 4/12: web-test — vitest(happy-dom) + Web 전용 coverage 회귀선 ──
  web-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Run @junds/web unit coverage gate
        run: npm run coverage -w @junds/web
      - name: Upload @junds/web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junds-web-coverage
          path: coverage/web
          if-no-files-found: error

  # happy-dom으로 대체할 수 없는 실제 엔진 차이를 세 브라우저에서 병렬 검증한다.
  # 각 잡은 자기 브라우저만 설치하므로 한 잡의 설치/실패가 다른 결과를 가리지 않는다.
  # ── 게이트 5/12: web-browser — Chromium/Firefox/WebKit 실엔진 매트릭스 ──
  web-browser:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: web-browser (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build @junds/web
        run: npm run build -w @junds/web
      - name: Run browser suite on ${{ matrix.browser }}
        run: npm run test:browser -w @junds/web -- --project=${{ matrix.browser }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: junds-web-${{ matrix.browser }}-failure
          path: |
            packages/web/test-results
            packages/web/playwright-report
          if-no-files-found: ignore

  # ── 게이트 6/12: web-a11y — 실제 fixture 범위 + axe 정책/coverage 검증 ──
  web-a11y:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build @junds/web (데모는 dist 산출물만 로드)
        run: npm run build -w @junds/web
      - name: Run axe-core audit on demo pages
        run: npm run audit:a11y -w @junds/web
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junds-web-a11y
          path: coverage/web-a11y/a11y-summary.json
          if-no-files-found: error

  # ── 게이트 7/12: size-budget — W1/W2 gzip 예산 + 기준선 +3% (05-perf §3.1) ──
  size-budget:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Enforce size budgets (benchmarks/size-gate.mjs)
        run: npm run size:web

  # ── 게이트 8/12: react-build — React >=18 약속을 18/19 양쪽에서 실측 ──
  react-build:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        react: [18, 19]
    name: react-build (React ${{ matrix.react }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Select React ${{ matrix.react }} peer
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --legacy-peer-deps \
            react@${{ matrix.react }} react-dom@${{ matrix.react }} \
            @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
          node -e "for (const p of ['react','react-dom']) { const v=require(p+'/package.json').version; if (!v.startsWith('${{ matrix.react }}.')) throw new Error(p+' resolved to '+v); console.log(p, v) }"
      # 어댑터 typecheck는 @junds/web dist/types를 참조한다.
      - name: Build @junds/web (어댑터 typecheck 전제)
        run: npm run build -w @junds/web
      - name: Build + typecheck @junds/react
        run: npm run build -w @junds/react && npm run typecheck -w @junds/react
      - name: Run @junds/react coverage gate
        run: npm run coverage -w @junds/react
      - name: Upload React ${{ matrix.react }} coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junds-react-${{ matrix.react }}-coverage
          path: coverage/react
          if-no-files-found: error

  # ── 게이트 9/12: finance-data-test — 모킹 기반 vitest, 실 API 호출 금지 (01 §9) ──
  finance-data-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Test @junds/finance-data
        run: |
          if ! node -e "const s=require('./packages/finance-data/package.json').scripts||{};process.exit(s.test?0:1)"; then
            echo "::notice title=finance-data-test::@junds/finance-data는 자리표시자(G3에서 이관·구현) — 스크립트 부재로 무해 통과. 스크립트가 생기면 실게이트로 자동 전환."
          fi
          npm run test -w @junds/finance-data --if-present

  # ── 게이트 10/12: ios-build — macos-14, xcodebuild 경유 (DEC-013-6) ──
  # 로컬 검증 불가(작업 머신 Xcode 서명 파손) — CI 첫 실행 확인 항목.
  # 실패 시 1순위 확인: 스킴 이름. 진단 스텝의 `xcodebuild -list` 출력에서 실제 스킴을
  # 확인하고, `JunDS`가 아니라 `JunDS-Package`라면 루트 package.json의 ios:* 스크립트를 교정.
  ios-build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain diagnostics (advisory)
        run: |
          xcodebuild -version || true
          xcodebuild -list || true
      - name: Build JunDS (SPM via xcodebuild)
        run: npm run ios:build

  # ── 게이트 11/12: ios-test — macos-14 시뮬레이터 (Core 로직 + 토큰 패리티 XCTest) ──
  # macos-14 기본 Xcode 15.x의 iOS 17 런타임에 iPhone 15 시뮬레이터가 포함된다 —
  # ios:test의 'iPhone 15' destination은 macos-14에선 성립 예상. 단 DEC-015-4b가 실측했듯
  # 최신 로컬 런타임(iPhone 17 세대)에는 없는 이름이므로, 러너 이미지/Xcode 승급 시
  # 진단 스텝의 사용 가능 디바이스 목록에서 destination 이름을 교정할 것.
  ios-test:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Simulator diagnostics (advisory)
        run: xcrun simctl list devices available | grep -i iphone | head -20 || true
      - name: Test JunDS (simulator)
        run: npm run ios:test

  # ── 게이트 12/12: bench-smoke — G2까지 advisory (05-perf §3.2), G3부터 실게이트 승격 ──
  bench-smoke:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # G2까지 advisory — G3 정식화 시 이 줄 삭제
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies (cache miss fallback)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build @junds/web (벤치 페이지는 dist 산출물 로드)
        run: npm run build -w @junds/web
      - name: Run bench smoke (S3 modal, W3 게이트)
        run: npm run bench
