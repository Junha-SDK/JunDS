name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint
        run: npx eslint .

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [lib, app, test]
    name: typecheck (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run type check (${{ matrix.project }})
        run: npm run typecheck:${{ matrix.project }}

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm run test

  build-lib:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Build library
        run: npm run build:lib

  bundle-check:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Build library
        run: npm run build:lib
      - name: Analyze bundle
        run: npm run analyze

  a11y:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run accessibility tests (in-suite)
        run: npx vitest run --grep "a11y"

      - name: Run consolidated a11y audit
        run: npm run audit:a11y

  validate-requirements:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Validate requirements/*.md
        run: npm run validate:requirements

  type-contracts:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Run prop signature contract tests
        run: npm run test:types

  ai-artifacts-fresh:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Regenerate .ai/MAP.md and .ai/props.json
        run: npm run map && npm run extract-props
      - name: Verify artifacts unchanged
        run: |
          if ! git diff --quiet .ai/MAP.md .ai/props.json; then
            echo "✗ .ai/MAP.md or .ai/props.json is stale. Run 'npm run map && npm run extract-props' and commit." >&2
            git --no-pager diff .ai/MAP.md .ai/props.json | head -120
            exit 1
          fi
          echo "✓ .ai artifacts in sync with source"
