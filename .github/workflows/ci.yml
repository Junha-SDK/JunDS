# CI — v2 레인 (01-repo-structure §9: 기존 14개 잡은 존속하되 paths 필터로 트리거 강등).
# v3 레인은 .github/workflows/junds-v3.yml. 잡 자체는 변경·삭제하지 않는다.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "ds/**"
      - "app/**"
      - "scripts/**"
      - "requirements/**"
      - "e2e/**"
      - ".storybook/**"
      - "public/**"
      - ".ai/**"
      - "rollup.config.mjs"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "vitest.a11y.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.build.json"
      - "tsconfig.lib.json"
      - "tsconfig.test.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ds/**"
      - "app/**"
      - "scripts/**"
      - "requirements/**"
      - "e2e/**"
      - ".storybook/**"
      - "public/**"
      - ".ai/**"
      - "rollup.config.mjs"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "playwright.config.ts"
      - "vitest.config.ts"
      - "vitest.a11y.config.ts"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.build.json"
      - "tsconfig.lib.json"
      - "tsconfig.test.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run ESLint
        run: npx eslint .

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [lib, app, test]
    name: typecheck (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run type check (${{ matrix.project }})
        run: npm run typecheck:${{ matrix.project }}

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm run test

  build-lib:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Build library
        run: npm run build:lib

  bundle-check:
    needs: build-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Build library
        run: npm run build:lib
      - name: Analyze bundle
        run: npm run analyze
      - name: Generate per-component bundle report
        run: npm run bundle:report
      - name: Enforce per-component budget
        run: npm run bundle:check

  a11y:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Run accessibility tests (in-suite)
        run: npx vitest run --grep "a11y"

      - name: Run consolidated a11y audit (report)
        run: npm run audit:a11y

      - name: Strict a11y audit (fails on critical/serious)
        run: npm run audit:a11y:strict

  validate-requirements:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Validate requirements/*.md
        run: npm run validate:requirements

  validate-search-dictionary:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Verify every showcase page is indexed
        run: npm run validate:search-dictionary

  compound-api:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Audit compound API (report)
        run: npm run audit:compound
      - name: Strict guard — Object.assign(Root, { … }) 금지 (legacy > 0 이면 실패)
        run: npm run audit:compound:strict

  scan-motion-rtl:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Scan motion + RTL coverage (advisory)
        run: npm run scan:motion-rtl

  ssr-rsc-smoke:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Verify SSR/RSC compatibility (hooks ↔ "use client")
        run: npm run scan:ssr-rsc:strict

  type-contracts:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Run prop signature contract tests
        run: npm run test:types

  ai-artifacts-fresh:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - name: Regenerate .ai/MAP.md and .ai/props.json
        run: npm run map && npm run extract-props
      - name: Verify artifacts unchanged
        run: |
          if ! git diff --quiet .ai/MAP.md .ai/props.json; then
            echo "✗ .ai/MAP.md or .ai/props.json is stale. Run 'npm run map && npm run extract-props' and commit." >&2
            git --no-pager diff .ai/MAP.md .ai/props.json | head -120
            exit 1
          fi
          echo "✓ .ai artifacts in sync with source"
