<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JunDS v3 — B3 폼 코어 데모 (컨트롤 11종)</title>
<!-- 빌드 산출물만으로 동작: junds.css + junds.min.js 각 한 줄 -->
<link rel="stylesheet" href="../dist/junds.css">
<script src="../dist/junds.min.js" defer></script>
<style>
  body { margin: 0; padding: 3rem 1.5rem; font-family: var(--jd-font-sans);
         background: var(--jd-color-background); color: var(--jd-color-foreground); }
  main { max-width: 44rem; margin-inline: auto; }
  #log { font-size: var(--jd-text-xs); color: var(--jd-color-muted-light); min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <jd-flex justify="between" align="center" mb="6">
    <jd-heading level="1" mb="0">B3 · 폼 코어</jd-heading>
    <jd-button id="theme-toggle" variant="outline" size="sm">다크 모드</jd-button>
  </jd-flex>
  <p id="log">이벤트 로그…</p>

  <jd-vstack gap="8">
    <jd-section title="jd-icon-button" description="variant 3종 × size 4종 — 접근성 label 필수">
      <jd-hstack gap="2">
        <jd-icon-button label="닫기 xs" size="xs"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></jd-icon-button>
        <jd-icon-button label="닫기 ghost"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></jd-icon-button>
        <jd-icon-button label="추가 outline" variant="outline"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></jd-icon-button>
        <jd-icon-button label="저장 filled" variant="filled" size="lg"><svg width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></jd-icon-button>
        <jd-icon-button label="비활성" variant="filled" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5"/></svg></jd-icon-button>
      </jd-hstack>
    </jd-section>

    <jd-section title="jd-label + jd-textarea" description="autoResize · showCount · error">
      <jd-vstack gap="1-5">
        <jd-label for="bio" required>자기소개</jd-label>
        <jd-textarea id="bio" name="bio" placeholder="여기에 입력하면 높이가 자동으로 늘어납니다…"
                     auto-resize show-count maxlength="120"></jd-textarea>
      </jd-vstack>
      <jd-textarea error value="에러 상태의 텍스트영역"></jd-textarea>
    </jd-section>

    <jd-section title="jd-checkbox + jd-radio-group">
      <jd-vstack gap="2">
        <jd-checkbox label="이용약관에 동의합니다" name="tos"></jd-checkbox>
        <jd-checkbox label="부분 선택 (indeterminate)" indeterminate></jd-checkbox>
        <jd-checkbox label="작은 사이즈" size="sm" checked></jd-checkbox>
        <jd-checkbox label="비활성" disabled></jd-checkbox>
      </jd-vstack>
      <jd-divider my="2"></jd-divider>
      <jd-radio-group name="priority" value="1" direction="horizontal">
        <script type="application/json">[
          {"value":"0","label":"긴급"},
          {"value":"1","label":"높음"},
          {"value":"2","label":"보통"},
          {"value":"3","label":"낮음","disabled":true}
        ]</script>
      </jd-radio-group>
    </jd-section>

    <jd-section title="jd-toggle + jd-switch" description="role=switch — 라벨 클릭 토글">
      <jd-hstack gap="6">
        <jd-toggle label="알림" checked></jd-toggle>
        <jd-toggle label="작게" size="sm"></jd-toggle>
        <jd-toggle label="비활성" disabled></jd-toggle>
      </jd-hstack>
      <jd-hstack gap="6">
        <jd-switch label="iOS 스타일" checked></jd-switch>
        <jd-switch label="sm" size="sm"></jd-switch>
        <jd-switch label="lg" size="lg" checked></jd-switch>
      </jd-hstack>
    </jd-section>

    <jd-section title="jd-slider" description="네이티브 range 위임 — 키보드·터치·폼 공짜">
      <jd-slider id="vol" value="30" show-value></jd-slider>
      <jd-slider value="60" color="success" size="sm"></jd-slider>
      <jd-slider value="80" color="danger" show-value max="200"></jd-slider>
      <jd-slider value="50">
        <script type="application/json">[
          {"value":0,"label":"0%"},{"value":50,"label":"50%"},{"value":100,"label":"100%"}
        ]</script>
      </jd-slider>
    </jd-section>

    <jd-section title="jd-range-slider" description="듀얼 썸 — 드래그·화살표 키">
      <jd-range-slider min-value="20" max-value="80" show-values></jd-range-slider>
      <jd-range-slider min-value="30" max-value="45" step="5" disabled></jd-range-slider>
    </jd-section>
  </jd-vstack>
</main>

<script type="module">
  const log = document.getElementById("log");
  for (const ev of ["jd-change", "jd-input"]) {
    document.addEventListener(ev, (e) => {
      log.textContent = `${ev} ← <${e.target.tagName.toLowerCase()}> ${JSON.stringify(e.detail)}`;
    });
  }
  const btn = document.getElementById("theme-toggle");
  btn.addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.getAttribute("data-jd-theme") !== "dark";
    root.setAttribute("data-jd-theme", dark ? "dark" : "light");
    btn.textContent = dark ? "라이트 모드" : "다크 모드";
  });
</script>
</body>
</html>
